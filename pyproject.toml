[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cf-cloner"
version = "1.0.0"
description = "Securely clone Cloudflare API tokens by mirroring scopes through 1Password CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Your Name", email = "you@example.com" }
]
keywords = ["cloudflare", "1password", "api-token", "cli", "security", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Utilities"
]
dependencies = [
  "requests>=2.31.0"
]

[project.urls]
Homepage = "https://github.com/YOUR_GITHUB_USERNAME/cf-cloner"
Issues = "https://github.com/YOUR_GITHUB_USERNAME/cf-cloner/issues"
Discussions = "https://github.com/YOUR_GITHUB_USERNAME/cf-cloner/discussions"
Source = "https://github.com/YOUR_GITHUB_USERNAME/cf-cloner"

[project.scripts]
cf-clone = "cf_cloner.cloner:main"

[tool.setuptools.packages.find]
where = ["src"]
